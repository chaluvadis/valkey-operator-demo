# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Image configuration
image:
  registry: ghcr.io
  repository: valkey-io/valkey-operator
  tag: 1619a21
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Deployment replicas
replicaCount: 2

# ServiceAccount configuration
serviceAccount:
  create: true
  name: ""
  automount: true
  annotations: {}
  labels: {}

# RBAC configuration
rbac:
  create: true

# Manager configuration
manager:
  leaderElection:
    enabled: true
  watchNamespace: ""
  args: []

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 1000

# Container security context
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Node scheduling constraints
nodeSelector: {}
tolerations: []
affinity: {}

# Pod metadata
podAnnotations: {}
podLabels: {}
commonLabels: {}

# NetworkPolicy configuration (optional)
networkPolicy:
  enabled: true
  targetNamespace: ""
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey-operator
  allowedNamespaceLabelKey: valkey-access
  allowedNamespaceLabelValue: "true"
  port: 8443

# Metrics configuration
metrics:
  enabled: true
  port: 8443
  service:
    type: ClusterIP
    annotations: {}
    labels: {}
