# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# =============================================================================
# valkey-operator - Control Plane Configuration
# =============================================================================
operator:
  replicaCount: 1

  image:
    registry: ghcr.io
    repository: valkey-io/valkey-operator
    tag: c02b66b
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""
    automount: true
    annotations: {}
    labels: {}

  rbac:
    create: true

  manager:
    leaderElection:
      enabled: true
    watchNamespace: ""
    args: []

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podAnnotations: {}
  podLabels: {}
  commonLabels: {}

  networkPolicy:
    enabled: false
    targetNamespace: ""
    podSelector:
      matchLabels:
        app.kubernetes.io/name: valkey
    allowedNamespaceLabelKey: valkey-access
    allowedNamespaceLabelValue: "true"
    port: 6379

  metrics:
    enabled: true
    port: 8443
    service:
      type: ClusterIP
      annotations: {}
      labels: {}

# =============================================================================
# valkey-cluster - Data Plane Configuration
# =============================================================================
cluster:
  enabled: true
  name: "valkey-cluster"
  replicas: 1
  shards: 3
  image:
    repository: int-harbor.int.taqniat.ae/valkey/valkey
    tag: "9-alpine3.23"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Persistent storage configuration
  dataStorage:
    enabled: false
    persistentVolumeClaimName: ""
    subPath: ""
    volumeName: "valkey-data"
    requestedSize: "5Gi"
    className: ""
    accessModes:
      - ReadWriteOnce
    keepPvc: true
    annotations: {}
    labels: {}
